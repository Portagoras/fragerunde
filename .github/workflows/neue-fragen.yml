# Neue Fragen mit Copilot (auch Copilot Free) erzeugen und als Pull Request
# zur Durchsicht vorschlagen.
#
# - Automatisch: alle 100 Tage neue TAGESFRAGEN (Paket "klassiker"). GitHub
#   kann "alle 100 Tage" nicht direkt planen – der Job läuft deshalb jeden
#   Montag und prüft selbst, ob seit der letzten Erzeugung
#   (.github/fragen-state.json) 100 Tage vergangen sind.
# - Auf Abruf: Actions → Neue Fragen → Run workflow, Paket auswählen. So
#   lassen sich die Zusatzpakete auffüllen, wann immer sie gebraucht werden.

name: Neue Fragen

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      paket:
        description: 'Paket (klassiker = Tagesfragen)'
        type: choice
        options: [klassiker, geschichten, entweder, niemals, party, frech, tiefgang, unteruns]
        default: klassiker
      anzahl:
        description: 'Wie viele neue Fragen?'
        type: number
        default: 10

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write

concurrency: neue-fragen

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PAKET: ${{ inputs.paket || 'klassiker' }}
      ANZAHL: ${{ inputs.anzahl || 10 }}
    steps:
      - uses: actions/checkout@v4

      - name: Ist etwas zu tun?
        id: due
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Auf Abruf: $ANZAHL Fragen für $PAKET"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(jq -r .last .github/fragen-state.json)
          days=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "Letzte Tagesfragen: $last (vor $days Tagen)"
          if [ "$days" -ge 100 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.due.outputs.run == 'true'
        with:
          node-version: 22

      - name: Copilot CLI installieren
        if: steps.due.outputs.run == 'true'
        run: npm install -g @github/copilot

      - name: Fragen erzeugen
        if: steps.due.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional: Personal Access Token mit "Copilot Requests"-Recht, falls
          # die Anmeldung über GITHUB_TOKEN nicht klappt.
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -n "$COPILOT_PAT" ]; then export COPILOT_GITHUB_TOKEN="$COPILOT_PAT"; fi
          node scripts/generate-questions.mjs --packs "$PAKET" --per-pack "$ANZAHL"

      - name: Tests
        if: steps.due.outputs.run == 'true'
        run: npm test

      - name: Pull Request öffnen
        if: steps.due.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PAKET" = "klassiker" ]; then title="Neue Tagesfragen ($(date +%F))"; else title="Neue Fragen für Paket $PAKET ($(date +%F))"; fi
          branch="neue-fragen-$PAKET-$(date +%F)-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add js/questions-generated.js .github/fragen-state.json
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --title "$title" --body-file generated-summary.md
          cat generated-summary.md >> "$GITHUB_STEP_SUMMARY"
